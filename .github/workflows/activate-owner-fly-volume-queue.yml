name: Activate original ASCENSION Fly worker queue

# Every website change must preserve the owner's original private engine image.
# Do NOT publish a public-source image that removes authored ASCENSION_CORE.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

# Share the existing production deployment lock; do not replace the worker
# with a public-source image lacking the original owner ASCENSION_CORE.
concurrency:
  group: ascension-fly-production
  cancel-in-progress: false

jobs:
  connect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: ascension-nexus-weave
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Validate owner-only engine prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FLY_API_TOKEN" || { echo "::error::Original Fly authorization missing"; exit 1; }
          # Rolling deployments replace Machine IDs. Resolve the worker by its
          # Fly process-group metadata rather than a retired historical ID.
          flyctl machines list --app "$FLY_APP" --json |
            jq -e 'any(.[]; .config.metadata.fly_process_group == "worker")'
          flyctl volumes list --app "$FLY_APP"
          python3 -m py_compile scripts/ascension-owner-queue/*.py
          python3 -m unittest discover -s tests -p test_ascension_private_supervisor.py -v
          sh -n scripts/ascension-owner-queue/ascension-start.sh
          echo "No external database or hosted AI provider configured or changed."
      - name: Build existing ASCENSION web source
        shell: bash
        env:
          NODE_ENV: production
          NITRO_PRESET: bun
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run build
          test -f .output/server/index.mjs
      - name: Restore and verify the ORIGINAL owner engine image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          # PINNED from the OWNER'S successful November 18 original private
          # Python source deployment, never from a later public web build.
          # A routine Fly web deploy had changed the worker machine image.
          base='registry.fly.io/ascension-nexus-weave:deployment-01M7QA1AHCPVMA39KRBSC1YCZ9'
          flyctl auth docker
          docker pull "$base"
          docker run --rm --entrypoint /bin/sh "$base" -c \
            'test -f /app/ASCENSION_CORE/cloud_queue_worker.py && test -f /app/clarity/core_runtime.py && test -f /app/ASCENSION_CORE/live_publication.py && test -f /app/verify_state.py'
          echo 'ASCENSION_ORIGINAL_AUTHOR_SOURCE_PRESERVED_BY_PINNED_PRIVATE_IMAGE'
          echo "original_base=$base" >> "$GITHUB_OUTPUT"
      - name: Locate original governed capability rejection line without exposing owner source
        shell: bash
        run: |
          set -euo pipefail
          base="${{ steps.image.outputs.original_base }}"
          docker run --rm -i --entrypoint /usr/bin/python3 "$base" - <<'PY'
          import ast
          from pathlib import Path
          root = Path('/app/ASCENSION_CORE')
          needles = ('BLOCKED_CAPABILITY_UNAVAILABLE', 'select_capability')
          count = 0
          for path in sorted(root.rglob('*.py')):
              if count >= 25:
                  break
              try:
                  source = path.read_text(encoding='utf-8')
                  lines = source.splitlines()
                  tree = ast.parse(source, filename=str(path))
              except (OSError, UnicodeError, SyntaxError):
                  continue
              for line_no, line in enumerate(lines, 1):
                  if not any(needle in line for needle in needles):
                      continue
                  functions = [node for node in ast.walk(tree)
                               if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
                               and node.lineno <= line_no <= (node.end_lineno or node.lineno)]
                  func = min(functions, key=lambda node: (node.end_lineno or line_no)-node.lineno).name if functions else 'module_scope'
                  print(f'ASCENSION_PRIVATE_CAPABILITY_SITE file={path.relative_to(root)} line={line_no} function={func}', flush=True)
                  count += 1
                  if count >= 25:
                      break
          print('ASCENSION_PRIVATE_CAPABILITY_SITES_FOUND', count, flush=True)
          PY
      - name: Audit owner's original physical-design capability routing before any deploy
        shell: bash
        run: |
          set -euo pipefail
          base="${{ steps.image.outputs.original_base }}"
          docker run --rm -i --entrypoint /usr/bin/python3 "$base" - <<'PY'
          import importlib.util
          import json
          from ASCENSION_CORE import capabilities
          objective = "I want to make Worker drones for people with dementia."
          contract = capabilities.requested_output_contract(objective, "")
          selected = capabilities.select_capability(objective, [])
          registry = capabilities.REGISTRY
          offers = capabilities.advertise_all()
          match = [item for item in offers if isinstance(item, dict) and
                   (item.get("capability_id") == contract or
                    item.get("output_contract") == contract)]
          # No source, objectives from other users, credentials or engine outputs
          # are sent to public CI logs.
          print("ASCENSION_PHYSICAL_ROUTE_AUDIT " + json.dumps({
              "requested_contract": str(contract)[:100],
              "selected_capability": str(selected)[:100],
              "registry_contains_contract": contract in registry,
              "registry_contains_selected": selected in registry,
              "contract_advertised": bool(match),
              "contract_available": any(item.get("available") is True for item in match),
              "construction_module_in_image":
                  importlib.util.find_spec("clarity.autosync.construction_engine") is not None,
          }, sort_keys=True), flush=True)
          if isinstance(selected, str) and selected.startswith("unavailable:"):
              # An incomplete physical-design feature must NOT block repairing
              # the separately existing authored worker/queue. V1 acceptance
              # remains gated by real objective/browser verification below.
              print("::warning::ASCENSION_AUTHORED_PHYSICAL_EXECUTOR_MISSING: physical designs remain unsupported; this deployment repairs transport only", flush=True)
          PY
      - name: Build and publish owner-only Fly image overlay
        id: overlay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ascension-owner-overlay"
          cp -a .output "$RUNNER_TEMP/ascension-owner-overlay/.output"
          cp scripts/ascension-owner-queue/*.py "$RUNNER_TEMP/ascension-owner-overlay/"
          cp scripts/ascension-owner-queue/ascension-start.sh "$RUNNER_TEMP/ascension-owner-overlay/"
          cp scripts/ascension-owner-queue/original-physical-capability.patch scripts/ascension-owner-queue/apply-original-physical-capability.py "$RUNNER_TEMP/ascension-owner-overlay/"
          cp scripts/ascension-owner-queue/Dockerfile.overlay "$RUNNER_TEMP/ascension-owner-overlay/Dockerfile"
          new_image="registry.fly.io/$FLY_APP:owner-queue-${GITHUB_SHA:0:12}"
          docker build -t "$new_image" --build-arg \
            "ORIGINAL_OWNER_IMAGE=${{ steps.image.outputs.original_base }}" \
            "$RUNNER_TEMP/ascension-owner-overlay"
          # No Fly deploy until the original engine registry resolves the requested contract.
          docker run --rm --entrypoint /usr/bin/python3 "$new_image" -c '
          from ASCENSION_CORE import capabilities
          from clarity.autosync.construction_engine import UniversalConstructionEngine
          objective = "I want to make Worker drones for people with dementia."
          expected = capabilities.requested_output_contract(objective, "")
          selected = capabilities.select_capability(objective, [])
          assert expected == "physical_design", expected
          assert selected == "physical_design", selected
          assert "physical_design" in capabilities.REGISTRY
          assert callable(UniversalConstructionEngine.create_job)
          assert callable(UniversalConstructionEngine.run_job)
          print("ASCENSION_ORIGINAL_CONSTRUCTION_CAPABILITY_REGISTRY_PREFLIGHT_PASSED")
          '
          docker push "$new_image"
          echo "new_image=$new_image" >> "$GITHUB_OUTPUT"
      - name: Verify authored Python queue can validate the Fly TLS chain
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /usr/bin/python3 \
            "${{ steps.overlay.outputs.new_image }}" -c \
            'import ssl, urllib.request; u="https://ascension-nexus-weave.fly.dev/api/public/ascension/answer-readiness"; data=urllib.request.urlopen(u, timeout=25).read(); assert data.startswith(b"{"), "ASCENSION readiness was not JSON"; print("ASCENSION_OWNER_CLOUD_WORKER_TLS_VERIFIED CA_roots="+ssl.get_default_verify_paths().cafile)'
      - name: Smoke-test existing V1 website executable before Fly replacement
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.overlay.outputs.new_image }}"
          cid="$(docker run --rm -d -e NODE_ENV=production -e PORT=8080 \
            -e HOST=0.0.0.0 -e NITRO_HOST=0.0.0.0 -e NITRO_PORT=8080 \
            -p 127.0.0.1:18080:8080 "$image" app)"
          trap 'docker logs "$cid" || true; docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          ready=0
          for attempt in $(seq 1 16); do
            if curl --fail --silent --show-error --max-time 3 \
              http://127.0.0.1:18080/ -o /dev/null; then
              ready=1
              break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' "$cid")" != "true" ]; then break; fi
            sleep 2
          done
          test "$ready" -eq 1 || { echo "::error::ASCENSION V1 web process could not serve HTTP."; exit 1; }
          echo 'ASCENSION_V1_WEB_PROCESS_BOOT_CONFIRMED'
      - name: Update only existing ASCENSION app and worker processes
        shell: bash
        run: |
          set -euo pipefail
          flyctl deploy --app "$FLY_APP" --config fly.owner-queue.toml \
            --image "${{ steps.overlay.outputs.new_image }}" \
            --process-groups app,worker --update-only --yes
      - name: Restore existing Fly volume worker ENTRYPOINT
        shell: bash
        run: |
          set -euo pipefail
          # The existing worker inherited a Bun ENTRYPOINT and immediately died
          # with "Script not found worker". Only its runtime ENTRYPOINT changes.
          machines="$(flyctl machines list --app "$FLY_APP" --json)"
          worker_count="$(printf '%s' "$machines" | jq '[.[] | select(.config.metadata.fly_process_group == "worker" and any(.config.mounts[]?; .volume != null))] | length')"
          test "$worker_count" -eq 1 || { echo "::error::Owner worker volume selection is ambiguous."; exit 1; }
          worker_id="$(printf '%s' "$machines" | jq -r '.[] | select(.config.metadata.fly_process_group == "worker" and any(.config.mounts[]?; .volume != null)) | .id')"
          # A Fly machine previously REPORTED this entrypoint while still
          # launching Bun as "bun worker". Never skip a real machine rewrite
          # based on the stale metadata; apply the original Python entrypoint.
          mount_volume="$(printf '%s' "$machines" | jq -r --arg id "$worker_id" '.[] | select(.id == $id) | [.config.mounts[]?.volume] | first // empty')"
          test -n "$mount_volume" || { echo "::error::Original worker volume was not identified."; exit 1; }
          flyctl machine update "$worker_id" --app "$FLY_APP" --config fly.owner-queue.toml \
            --entrypoint "/app/ascension-start.sh" --command "worker" \
            --image "${{ steps.overlay.outputs.new_image }}" --yes
          refreshed="$(flyctl machines list --app "$FLY_APP" --json)"
          printf '%s' "$refreshed" | jq -e --arg id "$worker_id" --arg volume "$mount_volume" \
            'any(.[]; .id == $id and .config.init.entrypoint == ["/app/ascension-start.sh"] and .config.init.cmd == ["worker"] and any(.config.mounts[]?; .volume == $volume))'
          echo "ASCENSION_ORIGINAL_OWNER_WORKER_ENTRYPOINT_RESTORED_WITH_VOLUME"
      - name: Validate ORIGINAL governed publication and private transport
        shell: bash
        run: |
          set -euo pipefail
          # Fly can replace the worker's machine ID while its lease is settling.
          # Retry state/SSH inspection but NEVER treat a successful Fly update
          # or public HTTP response as proof of an actual governed execution.
          inspected=0
          for attempt in $(seq 1 16); do
            workers="$(flyctl machines list --app "$FLY_APP" --json)"
            worker_count="$(printf '%s' "$workers" | jq '[.[] | select(.config.metadata.fly_process_group == "worker" and any(.config.mounts[]?; .volume != null))] | length')"
            if [ "$worker_count" -ne 1 ]; then
              echo "ASCENSION_FLY_WAITING_FOR_ONE_ORIGINAL_VOLUME_WORKER attempt=$attempt"
              sleep 3
              continue
            fi
            worker_id="$(printf '%s' "$workers" | jq -r '.[] | select(.config.metadata.fly_process_group == "worker" and any(.config.mounts[]?; .volume != null)) | .id')"
            machine_state="$(printf '%s' "$workers" | jq -r --arg id "$worker_id" '.[] | select(.id == $id) | .state')"
            if [ "$machine_state" != "started" ]; then
              flyctl machine start "$worker_id" --app "$FLY_APP" || true
              sleep 3
              continue
            fi
            if timeout 24s flyctl ssh console --app "$FLY_APP" --machine "$worker_id" \
              --command 'python3 /app/verify_state.py /data/ascension/state/live' \
              && timeout 24s flyctl ssh console --app "$FLY_APP" --machine "$worker_id" \
              --command 'python3 /app/probe-ascension-private.py'; then
              inspected=1
              break
            fi
            sleep 3
          done
          test "$inspected" -eq 1 || { echo "::error::Could not verify original running ASCENSION worker and volume."; exit 1; }
          for attempt in $(seq 1 10); do
            response="$(curl --fail --show-error --silent --max-time 20 \
              https://ascension-nexus-weave.fly.dev/api/public/ascension/answer-readiness || true)"
            if printf '%s' "$response" | jq -e '.owner_queue_transport_connected == true' >/dev/null 2>&1; then
              echo "ASCENSION_ENGAGE_BACKEND_CONNECTED_TO_ORIGINAL_GOVERNED_WORKER"
              exit 0
            fi
            sleep 3
          done
          echo "::error::ENGAGE website has not confirmed private worker connectivity."
          exit 1

      - name: Prove real Tree submission, four pathways and inspection views
        shell: bash
        timeout-minutes: 12
        env:
          ASCENSION_V1_WEBSITE: https://ascension-nexus-weave.fly.dev/
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ascension-live-browser"
          npm install --no-save --prefix "$RUNNER_TEMP/ascension-live-browser" playwright@1.56.1
          # GitHub ubuntu-26.04 is unsupported by Playwright's bundled installer.
          # Use the already installed Chrome or Chromium browser on this runner.
          browser="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v microsoft-edge-stable || true)"
          test -n "$browser" || { echo "::error::No Chromium-compatible browser present on runner."; exit 1; }
          ASCENSION_CHROME_BIN="$browser" \
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/ascension-live-browser/node_modules/playwright/index.mjs" \
            node tests/ascension-live-engage.mjs
      - name: Read Fly worker diagnostics after failed validation
        if: failure()
        shell: bash
        run: |
          set +e
          machines="$(flyctl machines list --app "$FLY_APP" --json)"
          worker_id="$(printf '%s' "$machines" | jq -r '[.[] | select(.config.metadata.fly_process_group == "worker") | .id][0] // empty')"
          if [ -n "$worker_id" ]; then
            flyctl machine status "$worker_id" --app "$FLY_APP"
            flyctl ssh console --app "$FLY_APP" --machine "$worker_id" \
              --command 'python3 /app/probe-ascension-private.py' || true
          fi
          timeout 12s flyctl logs --app "$FLY_APP" --no-tail 2>&1 |
            grep -E 'ASCENSION_|cloud_queue|Traceback|Exception|[Ee]rror|exit' | tail -n 80 || true
      - name: Save actual ASCENSION browser-test image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ascension-v1-live-browser-evidence
          path: ascension-v1-live-engage.png
          if-no-files-found: ignore
      - name: Publish non-secret deployment status to ASCENSION commit
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_JOB_RESULT: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ "$FINAL_JOB_RESULT" = 'success' ]; then
            state=success
            message='ASCENSION V1 live Tree and four pathways verified'
          else
            state=failure
            message='ASCENSION V1 end-to-end execution not yet verified; see run'
          fi
          jq -n --arg state "$state" --arg msg "$message" \
            --arg target "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{state: $state, description: $msg, context: "ASCENSION original Fly volume queue", target_url: $target}' |
            curl --fail --silent --show-error -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'Content-Type: application/json' \
              -d @- "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null
