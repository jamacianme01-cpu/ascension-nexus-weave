name: Activate original ASCENSION Fly worker queue

# Every website change must preserve the owner's original private engine image.
# Do NOT publish a public-source image that removes authored ASCENSION_CORE.
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  statuses: write

# Share the existing production deployment lock; do not replace the worker
# with a public-source image lacking the original owner ASCENSION_CORE.
concurrency:
  group: ascension-fly-production
  cancel-in-progress: false

jobs:
  connect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: ascension-nexus-weave
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Validate owner-only engine prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FLY_API_TOKEN" || { echo "::error::Original Fly authorization missing"; exit 1; }
          # Fly replaces machine IDs during deploys. Resolve the current
          # worker by the original, persistent ascension_state volume.
          owner_worker_id="$(flyctl volumes list --app "$FLY_APP" |
            awk -F '│' 'index($3,"ascension_state") && index($2,"created") {
              machine=$8; gsub(/[[:space:]]/,"",machine); print machine
            }')"
          # Match exactly one valid Fly machine ID. Refuse to guess on ambiguous mounts.
          if ! [[ "$owner_worker_id" =~ ^[a-f0-9]{14}$ ]]; then
            echo "::error::Cannot uniquely resolve the worker attached to ascension_state"
            exit 1
          fi
          owner_worker_id="${owner_worker_id}" # validated existing volume machine ID
          : '")"
          flyctl machine status "$owner_worker_id" --app "$FLY_APP"
          flyctl volumes list --app "$FLY_APP"
          python3 -m py_compile scripts/ascension-owner-queue/*.py
          sh -n scripts/ascension-owner-queue/ascension-start.sh
          echo "No external database or hosted AI provider configured or changed."
      - name: Build existing ASCENSION web source
        shell: bash
        env:
          NODE_ENV: production
          NITRO_PRESET: bun
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run build
          test -f .output/server/index.mjs
      - name: Restore and verify the ORIGINAL owner engine image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          # PINNED from the OWNER'S successful November 18 original private
          # Python source deployment, never from a later public web build.
          # A routine Fly web deploy had changed the worker machine image.
          base='registry.fly.io/ascension-nexus-weave:deployment-01M7QA1AHCPVMA39KRBSC1YCZ9'
          flyctl auth docker
          docker pull "$base"
          docker run --rm --entrypoint /bin/sh "$base" -c \
            'test -f /app/ASCENSION_CORE/cloud_queue_worker.py && test -f /app/clarity/core_runtime.py && test -f /app/ASCENSION_CORE/live_publication.py && test -f /app/verify_state.py'
          echo 'ASCENSION_ORIGINAL_AUTHOR_SOURCE_PRESERVED_BY_PINNED_PRIVATE_IMAGE'
          echo "original_base=$base" >> "$GITHUB_OUTPUT"
      - name: Build and publish owner-only Fly image overlay
        id: overlay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ascension-owner-overlay"
          cp -a .output "$RUNNER_TEMP/ascension-owner-overlay/.output"
          cp scripts/ascension-owner-queue/*.py "$RUNNER_TEMP/ascension-owner-overlay/"
          cp scripts/ascension-owner-queue/ascension-start.sh "$RUNNER_TEMP/ascension-owner-overlay/"
          cp scripts/ascension-owner-queue/Dockerfile.overlay "$RUNNER_TEMP/ascension-owner-overlay/Dockerfile"
          new_image="registry.fly.io/$FLY_APP:owner-queue-${GITHUB_SHA:0:12}"
          docker build -t "$new_image" --build-arg \
            "ORIGINAL_OWNER_IMAGE=${{ steps.image.outputs.original_base }}" \
            "$RUNNER_TEMP/ascension-owner-overlay"
          docker push "$new_image"
          echo "new_image=$new_image" >> "$GITHUB_OUTPUT"
      - name: Update only existing ASCENSION app and worker processes
        shell: bash
        run: |
          set -euo pipefail
          flyctl deploy --app "$FLY_APP" --config fly.owner-queue.toml \
            --image "${{ steps.overlay.outputs.new_image }}" \
            --process-groups app,worker --yes
      - name: Validate ORIGINAL governed publication and private transport
        shell: bash
        run: |
          set -euo pipefail
          # Fly's rolling deploy can report a stopped machine as healthy.
          # Explicitly start the EXISTING owner machine before probing it.
          # Re-resolve after deploy: Fly may replace the worker machine.
          owner_worker_id="$(flyctl volumes list --app "$FLY_APP" |
            awk -F '│' 'index($3,"ascension_state") && index($2,"created") {
              machine=$8; gsub(/[[:space:]]/,"",machine); print machine
            }')"
          # Match exactly one valid Fly machine ID. Refuse to guess on ambiguous mounts.
          if ! [[ "$owner_worker_id" =~ ^[a-f0-9]{14}$ ]]; then
            echo "::error::Cannot uniquely resolve the worker attached to ascension_state"
            exit 1
          fi
          owner_worker_id="${owner_worker_id}" # validated existing volume machine ID
          : '")"
          machine_state="$(flyctl machine status "$owner_worker_id" --app "$FLY_APP" |
            awk -F '│' '/^[[:space:]]*State:/ {state=$1; sub(/.*State:[[:space:]]*/,"",state); gsub(/[[:space:]]/,"",state); print state; exit}')"
          if [ "$machine_state" = stopped ]; then
            flyctl machine start "$owner_worker_id" --app "$FLY_APP"
          elif [ "$machine_state" != started ]; then
            echo "::error::Owner worker must be started or stopped, not $machine_state"
            exit 1
          fi
          flyctl ssh console --app "$FLY_APP" --machine "$owner_worker_id" \
            --command 'python3 /app/verify_state.py /data/ascension/state/live'
          flyctl ssh console --app "$FLY_APP" --machine "$owner_worker_id" \
            --command 'python3 /app/probe-ascension-private.py'
          for attempt in $(seq 1 10); do
            response="$(curl --fail --show-error --silent --max-time 20 \
              https://ascension-nexus-weave.fly.dev/api/public/ascension/answer-readiness || true)"
            if printf '%s' "$response" | jq -e '.owner_queue_transport_connected == true' >/dev/null 2>&1; then
              echo "ASCENSION_ENGAGE_BACKEND_CONNECTED_TO_ORIGINAL_GOVERNED_WORKER"
              exit 0
            fi
            sleep 3
          done
          echo "::error::ENGAGE website has not confirmed private worker connectivity."
          exit 1

      - name: Publish non-secret deployment status to ASCENSION commit
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_JOB_RESULT: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ "$FINAL_JOB_RESULT" = 'success' ]; then
            state=success
            message='Original ASCENSION queue connected and verified'
          else
            state=failure
            message='Original ASCENSION private queue deployment failed; see run'
          fi
          jq -n --arg state "$state" --arg msg "$message" \
            --arg target "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{state: $state, description: $msg, context: "ASCENSION original Fly volume queue", target_url: $target}' |
            curl --fail --silent --show-error -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'Content-Type: application/json' \
              -d @- "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null
