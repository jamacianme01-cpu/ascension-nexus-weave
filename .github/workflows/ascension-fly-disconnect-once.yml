name: One-time owner-directed ASCENSION Fly disconnection
# Requested directly by the owner: stop all Fly processes, without deleting
# the original app, source, private worker, or volume. Delete this workflow
# after confirmed execution so no further Fly connection runs from GitHub.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ascension-fly-disconnect-once.yml'

permissions:
  contents: read

concurrency:
  group: ascension-fly-production
  cancel-in-progress: false

jobs:
  disconnect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: ascension-nexus-weave
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Stop the owner's existing Fly processes and disable automatic restart
        shell: bash
        run: |
          set -euo pipefail
          test -n "${FLY_API_TOKEN:-}" || {
            echo "::error::GitHub Fly credential unavailable. No Fly machine was changed."
            exit 1
          }
          original="$(flyctl machines list --app "$FLY_APP" --json)"
          original_mounts="$(printf '%s' "$original" | jq -c '[.[] | .config.mounts[]?.volume] | sort')"
          mapfile -t ids < <(printf '%s' "$original" | jq -r '.[].id')
          test "${#ids[@]}" -gt 0 || {
            echo "::error::No existing ASCENSION Fly machine was found. No changes made."
            exit 1
          }
          for id in "${ids[@]}"; do
            # Preserve original image, mounted governed ledger volume and
            # user artifacts. Disable proxy autostart and restart-policy
            # before stopping each process. Never destroy a Fly machine.
            flyctl machine update "$id" --app "$FLY_APP" \
              --autostart=false --restart=no --skip-start --yes
            state="$(flyctl machines list --app "$FLY_APP" --json | jq -r --arg id "$id" '.[] | select(.id == $id) | .state')"
            if [ "$state" = started ] || [ "$state" = starting ] || [ "$state" = suspended ]; then
              flyctl machine stop "$id" --app "$FLY_APP" --wait-timeout 90s
            fi
          done
          final="$(flyctl machines list --app "$FLY_APP" --json)"
          final_mounts="$(printf '%s' "$final" | jq -c '[.[] | .config.mounts[]?.volume] | sort')"
          test "$original_mounts" = "$final_mounts" || {
            echo "::error::Fly mount inventory changed; inspect original governed volume."
            exit 1
          }
          printf '%s' "$final" | jq -e --argjson expected "${#ids[@]}" '
            length == $expected and
            all(.[];
              .state == "stopped" and
              ((.config.restart.policy // "no") == "no") and
              (all(.config.services[]?; .autostart != true))
            )
          ' >/dev/null || {
            echo "::error::ASCENSION Fly machines are not all stopped with autostart disabled."
            exit 1
          }
          echo "ASCENSION_FLY_PROCESSES_STOPPED_AUTOSTART_DISABLED_VOLUME_PRESERVED machines=${#ids[@]}"
