name: ASCENSION V1 actual live Tree acceptance
# One owner-triggered verification against an already deployed ASCENSION site.
# No deployment, Fly connection, hidden upload, or synthetic design model.
on:
  workflow_dispatch:
    inputs:
      website:
        description: "Existing ASCENSION HTTPS website to test (not a Fly address)"
        type: string
        required: true
        default: "https://ascension-nexus-weave-production.up.railway.app/"

permissions:
  contents: read

jobs:
  live-owner-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASCENSION_V1_WEBSITE: ${{ inputs.website }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Install disposable Chromium and browser test tools
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Require an existing secure non-Fly ASCENSION host
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ASCENSION_V1_WEBSITE" =~ ^https://[^/]+/ ]] || {
            echo "::error::Only an explicit existing HTTPS website is accepted."
            exit 1
          }
          case "$ASCENSION_V1_WEBSITE" in
            *".fly.dev"*|*".fly.io"*|*".internal"* )
              echo "::error::Fly/internal hosts are disconnected by the owner."
              exit 1 ;;
          esac
          curl --fail --show-error --silent --max-time 30 \
            --output /dev/null "$ASCENSION_V1_WEBSITE"
      - name: Exercise real Library Card, Tree speech, actual governed pathways, 3D inspection and blueprint
        shell: bash
        run: |
          set -euo pipefail
          export PLAYWRIGHT_MODULE
          PLAYWRIGHT_MODULE="$(node -p "require.resolve('playwright')")"
          node tests/ascension-live-engage.mjs
