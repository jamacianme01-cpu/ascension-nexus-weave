name: Deploy ASCENSION to Fly.io

# Manual deployments must use the owner's original private ASCENSION_CORE
# image overlay. Never deploy the public web-only Dockerfile to the worker.
on:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  deploy-original-owner-app:
    uses: ./.github/workflows/activate-owner-fly-volume-queue.yml
    secrets: inherit
