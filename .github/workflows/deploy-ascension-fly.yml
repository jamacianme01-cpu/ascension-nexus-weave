name: Deploy ASCENSION to Fly.io

# Manual deploy of the existing Fly app. Preserves ASCENSION_CORE worker volume
# and process groups. Does not introduce Lovable, Supabase, or external AI hosts.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ascension-fly-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Verify existing Fly.io authorization
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::FLY_API_TOKEN is not configured in GitHub Actions. No deployment was attempted."
            exit 1
          fi

      - name: Secure original ASCENSION internal publish channel
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if flyctl secrets list --app ascension-nexus-weave --json |
               jq -e 'any(.[]; (.name // .Name // "") == "ASCENSION_PUBLISH_TOKEN")' >/dev/null; then
            echo "ASCENSION internal publish token exists; retaining existing credential."
          else
            token="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
            echo "::add-mask::$token"
            flyctl secrets set --app ascension-nexus-weave --stage "ASCENSION_PUBLISH_TOKEN=$token" >/dev/null
            unset token
            echo "ASCENSION internal publish token securely staged in Fly for this deploy."
          fi

      - name: Ensure FLY_API_TOKEN is available to the running app (worker wake)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # The web process needs this secret at runtime so ENGAGE can wake the
          # worker process group when min_machines_running is 0.
          if flyctl secrets list --app ascension-nexus-weave --json |
               jq -e 'any(.[]; (.name // .Name // "") == "FLY_API_TOKEN")' >/dev/null; then
            echo "FLY_API_TOKEN already present on the Fly app; retaining."
          else
            flyctl secrets set --app ascension-nexus-weave --stage "FLY_API_TOKEN=$FLY_API_TOKEN" >/dev/null
            echo "FLY_API_TOKEN staged on the Fly app for worker wake on ENGAGE."
          fi

      - name: Deploy the existing ASCENSION app process
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --app ascension-nexus-weave --config fly.toml --process-groups app

      - name: Ensure worker process group has a machine (stays auto-stop capable)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # Create a worker machine if none exists. min_machines_running stays 0
          # in fly.toml so the machine can stop when idle; ENGAGE wakes it.
          count="$(flyctl machines list --app ascension-nexus-weave --json 2>/dev/null | jq '[.[] | select((.config.metadata.fly_process_group // .process_group // "") == "worker")] | length')"
          if [ "${count:-0}" -eq 0 ]; then
            echo "No worker machine found. Scaling worker process group to 1 once."
            flyctl scale count worker=1 --app ascension-nexus-weave --yes || \
              flyctl deploy --remote-only --app ascension-nexus-weave --config fly.toml --process-groups worker
          else
            echo "Worker machine count: $count (wake-on-ENGAGE; min_machines remains 0)."
          fi

      - name: Check Fly app status
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl status --app ascension-nexus-weave

      - name: Verify ASCENSION internal token was stored without displaying its value
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          flyctl secrets list --app ascension-nexus-weave --json |
            jq -e 'any(.[]; (.name // .Name // "") == "ASCENSION_PUBLISH_TOKEN")'
          echo "Owner-controlled ASCENSION web/worker publish token is stored in Fly."

      - name: Check deployed web server
        run: curl --fail --show-error --silent --retry 5 --retry-delay 10 --retry-all-errors https://ascension-nexus-weave.fly.dev/api/health
