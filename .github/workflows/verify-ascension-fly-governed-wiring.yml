name: Verify ASCENSION original engine Fly wiring
on:
  pull_request:
    paths:
      - 'Dockerfile.ascension-engines'
      - 'fly.ascension-engines.toml'
      - 'scripts/ascension-fly-governed-entrypoint.sh'
      - 'scripts/ascension-verify-live-state.py'
      - 'tests/test_ascension_fly_governed_contract.py'
      - '.github/workflows/verify-ascension-fly-governed-wiring.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check real ASCENSION source boundary and state/live
        run: python3 -m unittest discover -s tests -p test_ascension_fly_governed_contract.py -v
