name: Verify user-owned device storage in browser

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  device-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Test unattended encrypted desktop folder convergence
        run: node --test tests/device-background-sync.test.mjs
      - name: Install disposable browser test tools
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test real encrypted device storage without hosted services
        shell: bash
        run: |
          set -euo pipefail
          npx vite --config tests/device-browser.vite.mjs > "$RUNNER_TEMP/device-vite.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4182/tests/fixtures/device-local-first.html > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat "$RUNNER_TEMP/device-vite.log"
            exit 1
          fi
          node tests/device-local-first.browser.mjs
          node tests/governed-crystal-memory.browser.mjs
          node tests/device-folder-sync.browser.mjs
