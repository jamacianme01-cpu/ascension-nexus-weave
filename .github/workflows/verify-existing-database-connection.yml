name: Verify ASCENSION existing storage contract (offline)
# Owner disconnected Fly.io on 2026-11-23.
# This test checks local repository contracts; it never accesses Fly.
on:
  pull_request:
    paths:
      - 'src/lib/ascension/data/postgres.server.ts'
      - 'src/lib/ascension/data/client.server.ts'
      - 'src/routes/api/public/ascension/answer-readiness.ts'
      - 'src/lib/ascension/guest.functions.ts'
      - 'src/routes/api/health.ts'
      - 'tests/reconnect-existing-database.test.mjs'
      - '.github/workflows/verify-existing-database-connection.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate existing ASCENSION storage schema without remote connections
        run: node --test tests/reconnect-existing-database.test.mjs
