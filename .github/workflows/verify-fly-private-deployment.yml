name: Verify ASCENSION Fly private-core boundary

on:
  pull_request:
    paths:
      - 'fly.toml'
      - 'Dockerfile'
      - '.dockerignore'
      - '.gitignore'
      - 'scripts/ascension-fly-entrypoint.sh'
      - 'scripts/verify_fly_private_core.py'
      - 'tests/test_fly_private_deployment.py'
      - '.github/workflows/deploy-ascension-fly.yml'
      - '.github/workflows/verify-fly-private-deployment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Fly worker/web separation without private secrets
        run: python3 -m unittest discover -s tests -p test_fly_private_deployment.py -v
