name: ASCENSION restored live ENGAGE verification
on:
  push:
    branches:
      - verification/skytech-restored-live-20261106
permissions:
  contents: read
jobs:
  live-pathways:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Test the actual restored Railway server (no mocks)
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          const base="https://ascension-nexus-weave-production.up.railway.app";
          const opts={signal:AbortSignal.timeout(115000)};
          const home=await fetch(base+"/",opts);
          console.log("HOME STATUS",home.status);
          assert.equal(home.status,200,"Restored Railway home must open");
          const capability=await fetch(base+"/api/public/ascension/independent",opts);
          const capabilityText=await capability.text();
          console.log("CAPABILITY STATUS",capability.status,capabilityText.slice(0,600));
          assert.equal(capability.status,200,"Public ASCENSION API must respond");
          const body=JSON.stringify({objective:"make a worker drone",phase:"pathways"});
          const response=await fetch(base+"/api/public/ascension/independent",{
            method:"POST",headers:{"content-type":"application/json"},body,
            signal:AbortSignal.timeout(115000)
          });
          const payload=await response.text();
          let data;
          try { data=JSON.parse(payload); } catch { data={error:payload.slice(0,700)}; }
          console.log("ENGAGE STATUS",response.status);
          if(!response.ok){console.log("ENGAGE ERROR",String(data.error??data.message??JSON.stringify(data)).slice(0,700));}
          assert.equal(response.status,200,"Real ENGAGE pathway generation must return HTTP 200");
          assert.equal(data.pathways?.length,3,"Three distinct pathways required");
          assert.ok(data.blend?.title && data.blend?.summary,"Fourth BLEND required");
          const names=[...data.pathways.map(x=>x.title),data.blend.title];
          console.log("FOUR PATHWAY TITLES",JSON.stringify(names));
          assert.equal(new Set(names).size,4,"Four named choices must be distinct");
          console.log("PASS RESTORED LIVE ENGAGE: three pathways plus BLEND");
          NODE
