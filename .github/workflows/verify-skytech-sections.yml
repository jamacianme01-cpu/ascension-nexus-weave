name: Verify Skytech ASCENSION sections and evidence branch
on:
  push:
    branches:
      - repair/v1-selected-design-precision-20261109
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v1-section-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --no-save
      - name: Compile ASCENSION without altering deployment
        run: bun run build
      - name: Preserve approved V1 and current Skytech-only runtime
        run: |
          test ! -f src/lib/ascension/engine/local-answer.server.ts
          test ! -f src/lib/ascension/brain-relay.server.ts
          test -f .output/server/index.mjs
          bun tests/v1-repair-contract.test.mjs
          bun tests/selected-pathway-design.test.mjs
          bun tests/creation-source-context.test.mjs
      - name: Verify section selectors and evidence controls in browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          bun run dev -- --host 127.0.0.1 --port 4174 > /tmp/ascension-sections-dev.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4174/ >/dev/null; then break; fi
            sleep 2
          done
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          try {
            const page = await browser.newPage({viewport:{width:1280,height:800}});
            await page.goto('http://127.0.0.1:4174/',{waitUntil:'domcontentloaded'});
            await page.getByRole('group',{name:'Choose your ASCENSION section'}).waitFor({timeout:20000});
            if (await page.locator('section[aria-label="ASCENSION Tree world"]').count()) throw Error('Tree entered before Book choice');
            if (await page.locator('textarea#objective').count()) throw Error('Objective appears before Tree entry');
            for (const name of ['Business Planner','Build / Create','Guidance']) {
              if (await page.getByRole('button',{name,exact:true}).count()!==1) throw Error(name+' missing from Book');
            }
            await page.getByRole('button',{name:'Business Planner',exact:true}).click();
            await page.locator('section[aria-label="ASCENSION Tree world"]').waitFor();
            await page.getByRole('textbox',{name:'Ask the Tree'}).waitFor();
            if(await page.getByText("Let's work on it together.",{exact:false}).count()) throw Error('Unrequested chat script was restored');
            await page.getByRole('textbox',{name:'What do you want to accomplish?'}).waitFor();
            for (const name of ['Upload pictures','Take picture','Upload documents']) {
              if (await page.getByText(name,{exact:true}).count()!==1) throw Error(name+' control missing in Tree world');
            }
            const image=page.locator('input[type="file"][accept="image/*"][multiple]');
            await image.setInputFiles({name:'shelf.png',mimeType:'image/png',buffer:Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9YzDL5gAAAAASUVORK5CYII=','base64')});
            await page.getByText('shelf.jpg',{exact:false}).waitFor({timeout:10000});
            const doc=page.locator('input[type="file"][accept*=".pdf"]');
            await doc.setInputFiles({name:'sales.csv',mimeType:'text/csv',buffer:Buffer.from('month,sales\nOctober,100\n'+'0'.repeat(20000))});
            await page.getByText('sales.csv',{exact:false}).waitFor({timeout:10000});
            await doc.setInputFiles({name:'business.pdf',mimeType:'application/pdf',buffer:Buffer.alloc(3_000_000,32)});
            await page.getByText('business.pdf',{exact:false}).waitFor({timeout:15000});
            if(await page.getByText('exceeds the 2 MB document limit').count()) throw Error('Old upload limit still present');
            console.log('PASS: current Tree entry, three sections, picture and document intake');
            const plan={
              executive_summary:'Improve existing shop sales.',customers_and_market:'Local repeat customers.',
              operations_and_inventory:'Keep verified stock records.',marketing_and_sales:'Prioritize existing channels.',
              revenue_and_cost_baseline:'Numbers not provided.',profit_improvement:'Reduce returns.',
              financial_projection:'No data to project.',assumptions_and_missing_data:'Await cost figures.',
              milestones_and_risks:'Verify first action.'
            };
            const makePath=(id,title)=>({id,title,summary:'Concrete continuation of the selected shop plan.',steps:[
              'Use the current records to identify the first bottleneck.',
              'Change the identified process without replacing the business.',
              'Review the actual sales and cost results after the change.'
            ],tradeoffs:['Requires real measured inputs.'],parts:[],plan});
            const fake={experience:'guidance',introduction:'Business approaches',
              pathways:[makePath('p1','Current shop'),makePath('p2','Alternate shop'),makePath('p3','Third shop')],
              blend:{...makePath('blend','Combined shop'),blend_reason:'Uses recorded steps.'},
              specialty_lead:'unavailable',contributors:['OpenAI'],unavailable:['Claude','Grok'],providerErrors:[],
              mode:'openai-only-provisional',verified:false,governance:'unverified',persistence:'none'};
            const pathwayRequests=[];
            await page.route('**/api/public/ascension/independent',async route=>{
              const req=route.request();
              if(req.method()!=='POST')return route.continue();
              const body=req.postDataJSON();
              if(body.phase==='pathways'){
                pathwayRequests.push(body);
                return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify(fake)});
              }
              if(body.phase==='guide')return route.fulfill({status:200,contentType:'application/json',
                body:JSON.stringify({answer:'First review the actual sales figures.'})});
              return route.fulfill({status:400,contentType:'application/json',body:'{"error":"Mock phase unavailable"}'});
            });
            await page.getByRole('textbox',{name:'What do you want to accomplish?'}).fill('Improve the shop we already operate');
            await page.getByRole('button',{name:'ENGAGE ASCENSION'}).click();
            await page.getByRole('tab').first().click();
            await page.getByRole('button',{name:'ENTER PATHWAY'}).click();
            await page.locator('.ascension-tree-character img').waitFor({timeout:15000});
            await page.getByRole('list',{name:'Business plan implementation sequence'}).waitFor();
            if(await page.locator('.ascension-entry-guide').count())throw Error('Unrequested floating Tree panel persisted');
            await page.locator('#pathway-refinement').fill('We already completed the first step; continue from the next.');
            await page.getByRole('button',{name:'BUILD ON RESULT'}).click();
            for(let i=0;i<50&&pathwayRequests.length<2;i++)await page.waitForTimeout(100);
            if(pathwayRequests.length!==2 || pathwayRequests[0].attachments?.length!==3 || !pathwayRequests[0].attachments?.some(f=>f.name==='business.pdf') || !pathwayRequests[1].firstAnswer?.includes('selected_pathway'))
              throw Error('BUILD ON RESULT lost the selected business plan');
            console.log('PASS: Book selection, spoken Tree control, persistent pathway Tree, real business workflow, and context-preserving refinement');
          } finally { await browser.close(); }
          NODE
