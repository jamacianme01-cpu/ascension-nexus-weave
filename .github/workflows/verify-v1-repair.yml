name: ASCENSION V1 repair verification
on:
  push:
    branches:
      - repair/v1-pathway-entry-20261029
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-interface:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --no-save
      - run: bun run build
      - name: Ensure actual Node HTTP server exists
        run: test -f .output/server/index.mjs
      - run: bun tests/v1-repair-contract.test.mjs
      # Historic suite still assumes the retired Z.AI paid/free stream endpoint.
      # Keep its failure visible in logs; don't re-enable that provider in V1.
      - name: Legacy integration diagnostics (retired provider assumptions)
        continue-on-error: true
        run: bun tests/interface.test.mjs
      - run: bun tests/creation-source-context.test.mjs
      - name: Browser acceptance against the original V1 experience
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          bun run dev -- --host 127.0.0.1 --port 4174 > /tmp/ascension-v1-dev.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4174/ > /dev/null; then break; fi
            sleep 2
          done
          node tests/v1-browser-smoke.mjs
