name: ASCENSION V1 repair verification
on:
  push:
    branches:
      - repair/v1-pathway-entry-20261029
  workflow_dispatch:
concurrency:
  group: ascension-v1-repair-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build-and-interface:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --no-save
      - run: bun run build
      - name: Ensure actual Node HTTP server exists
        run: test -f .output/server/index.mjs
      - run: bun tests/v1-repair-contract.test.mjs
      # Historic suite still assumes the retired Z.AI paid/free stream endpoint.
      # Keep its failure visible in logs; don't re-enable that provider in V1.
      - name: Legacy integration diagnostics (retired provider assumptions)
        continue-on-error: true
        run: bun tests/interface.test.mjs
      - run: bun tests/creation-source-context.test.mjs
      - name: Browser acceptance against the original V1 experience
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          bun run dev -- --host 127.0.0.1 --port 4174 > /tmp/ascension-v1-dev.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4174/ > /dev/null; then break; fi
            sleep 2
          done
          timeout 150s node tests/v1-browser-smoke.mjs
      - name: Browser acceptance on deployed ASCENSION V1
        env:
          ASCENSION_BASE_URL: https://ascension-nexus-weave-production.up.railway.app/
          V1_CAPTURE: "1"
        run: |
          for attempt in $(seq 1 10); do
            if timeout 150s node tests/v1-browser-smoke.mjs; then
              exit 0
            fi
            echo "Deployed site not yet on this revision; retrying browser acceptance."
            sleep 15
          done
          exit 1

      # Canonical 3D assembly/blueprint/explosion acceptance replaces independent
      # image generations. Those are not evidence of one consistent invention.
