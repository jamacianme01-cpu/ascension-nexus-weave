name: Verify Windows ASCENSION hub launcher
on:
  pull_request:
    paths:
      - "scripts/Start_ASCENSION_Hub.ps1"
      - "scripts/ascension_hub_worker.py"
      - "tests/test_ascension_hub_worker.py"
      - ".github/workflows/verify-windows-hub.yml"
  push:
    paths:
      - "scripts/Start_ASCENSION_Hub.ps1"
      - "scripts/ascension_hub_worker.py"
      - "tests/test_ascension_hub_worker.py"
      - ".github/workflows/verify-windows-hub.yml"

jobs:
  parse-windows-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse launcher using Windows PowerShell
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts\Start_ASCENSION_Hub.ps1'
          [System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.ToString() }
            exit 1
          }
          Write-Host 'Windows hub launcher syntax valid'
      - name: Verify DPAPI key save and reload on Windows
        shell: powershell
        run: |
          $sample = '0123456789abcdef' * 6
          $secret = ConvertTo-SecureString -String $sample -AsPlainText -Force
          $keyfile = Join-Path $env:RUNNER_TEMP 'hub-key.dpapi'
          $secret | ConvertFrom-SecureString | Set-Content -LiteralPath $keyfile -Encoding UTF8
          $loaded = ConvertTo-SecureString -String ((Get-Content -LiteralPath $keyfile -Raw).Trim()) -ErrorAction Stop
          $ptr = [Runtime.InteropServices.Marshal]::SecureStringToBSTR($loaded)
          try {
            $plain = [Runtime.InteropServices.Marshal]::PtrToStringBSTR($ptr)
          } finally {
            [Runtime.InteropServices.Marshal]::ZeroFreeBSTR($ptr)
            $loaded.Dispose()
            $secret.Dispose()
          }
          if ($plain -cne $sample) { throw 'DPAPI ciphertext roundtrip failed' }
          Write-Host 'Windows DPAPI key roundtrip valid'
      - name: Check hub Python syntax and fail-closed relay behavior
        shell: powershell
        run: |
          python -m py_compile scripts/ascension_hub_worker.py
          python -m unittest discover -s tests -p test_ascension_hub_worker.py -v
