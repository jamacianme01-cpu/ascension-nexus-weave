name: Verify ASCENSION

on:
  push:
    branches: [main, independent-hub-no-lovable-zai]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run test:interface
      - run: bun run build
      - run: bunx tsc --noEmit
      - run: python -m unittest discover -s tests -p 'test_ascension_knowledge_memory.py' -v
