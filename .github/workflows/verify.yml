name: Verify ASCENSION

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run test:interface
      - run: node tests/tree-voice.test.mjs
      - run: npm run build
      - name: TypeScript checks with file annotations
        shell: bash
        run: |
          set +e
          npx tsc --noEmit --pretty false > "$RUNNER_TEMP/ascension-typescript.log" 2>&1
          result=$?
          cat "$RUNNER_TEMP/ascension-typescript.log"
          node --input-type=module -e '
          import { readFileSync } from "node:fs";
          const escape = value => value.replaceAll("%", "%25").replaceAll("\r", "%0D").replaceAll("\n", "%0A");
          const property = value => escape(value).replaceAll(":", "%3A").replaceAll(",", "%2C");
          const lines = readFileSync(process.env.RUNNER_TEMP + "/ascension-typescript.log", "utf8").split(/\r?\n/);
          for (const line of lines) {
            const match = line.match(/^(.+)\((\d+),(\d+)\): error (TS\d+): (.*)$/);
            if (match) console.log(`::error file=${property(match[1])},line=${match[2]},col=${match[3]}::${escape(match[4] + ": " + match[5])}`);
            else if (/^error TS\d+:/.test(line)) console.log(`::error::${escape(line)}`)
          }
          '
          exit "$result"
