# Existing owner ASCENSION Fly app and original worker/volume, no new resources.
app = 'ascension-nexus-weave'
primary_region = 'ams'

[env]
  PORT = '8080'
  NITRO_PORT = '8080'
  HOST = '0.0.0.0'
  NITRO_HOST = '0.0.0.0'
  ASCENSION_LIVE_ROOT = '/data/ascension/state/live'
  ASCENSION_QUEUE_URL = 'http://localhost:9091/api/public/ascension/execution-queue'
  ASCENSION_VOLUME_TRANSPORT_URL = 'http://worker.process.ascension-nexus-weave.internal:9091'
  ASCENSION_STATE_BOOTSTRAP = '0'

[processes]
  app = '/app/.output/server/index.mjs'
  worker = 'worker'

[experimental]
  entrypoint = ['/app/ascension-start.sh']

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[mounts]]
  source = 'ascension_state'
  destination = '/data/ascension'
  processes = ['worker']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  processes = ['app']

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 2
  processes = ['worker']
