# fly.toml app configuration file generated for ascension-nexus-weave on 2026-11-15T08:45:40Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'ascension-nexus-weave'
primary_region = 'ams'

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = '8080'
  NITRO_PORT = '8080'
  HOST = '0.0.0.0'
  NITRO_HOST = '0.0.0.0'
  ASCENSION_QUEUE_URL = 'https://ascension-nexus-weave.fly.dev/api/public/ascension/execution-queue'

# Both process groups use the same image. The worker runs the owner's
# private ASCENSION_CORE package, not a replacement AI or external computer.
[processes]
  web = "web"
  worker = "worker"

[experimental]
  entrypoint = ["/usr/local/bin/ascension-start"]

[http_service]
  processes = ['web']
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

# Governed state and crash-recovery journal must survive restarts.
# Provision the named Fly volume before deploying the worker.
[[mounts]]
  source = 'ascension_state'
  destination = '/data/ascension'
  processes = ['worker']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
