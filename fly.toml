# ASCENSION V1 — Fly.io routing.
# Uses the existing Dockerfile and Nitro server. No Railway service required.
[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  NITRO_PORT = "8080"
  NITRO_HOST = "0.0.0.0"
  NODE_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"
