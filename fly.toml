# fly.toml app configuration file generated for ascension-nexus-weave on 2026-11-15T08:45:40Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'ascension-nexus-weave'
primary_region = 'ams'

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = '8080'
  NITRO_PORT = '8080'
  HOST = '0.0.0.0'
  NITRO_HOST = '0.0.0.0'
  ASCENSION_VOLUME_TRANSPORT_URL = 'http://worker.process.ascension-nexus-weave.internal:9091'
  ASCENSION_STATE_BOOTSTRAP = '0'

# flyctl clears a nil entrypoint, which leaves the Bun image's
# docker-entrypoint.sh and its relative command in place.
[processes]
  app = "/app/.output/server/index.mjs"
  worker = "worker"

[experimental]
  entrypoint = ["/usr/local/bin/bun"]
  cmd = ["/app/.output/server/index.mjs"]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[mounts]]
  source = 'ascension_state'
  destination = '/data/ascension'
  processes = ['worker']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 2
  processes = ['worker']
